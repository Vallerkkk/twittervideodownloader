<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Configuração focada em mobile para evitar zoom acidental -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
        }
        /* O font-size: 16px evita que o iPhone dê zoom automático ao clicar no campo de texto */
        input[type="url"] { 
            font-size: 16px; 
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-slate-900 to-black text-white min-h-[100dvh] flex flex-col selection:bg-blue-500 selection:text-white">
    
    <!-- Centralizador principal -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-8">
        
        <!-- Cartão Principal com efeito Glassmorphism (vidro) -->
        <div class="bg-white/5 backdrop-blur-xl border border-white/10 p-6 sm:p-10 rounded-[32px] shadow-[0_8px_32px_0_rgba(0,0,0,0.37)] w-full max-w-md text-center transition-all duration-300">
            
            <!-- Logo e Título -->
            <div class="mb-8">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-tr from-blue-600 to-purple-600 mb-4 shadow-lg shadow-purple-500/40">
                    <i class="fa-solid fa-cloud-arrow-down text-3xl text-white"></i>
                </div>
                <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">
                    Downloader Pro
                </h1>
                <p class="text-gray-400 mt-3 text-sm leading-relaxed px-2">
                    Cole o link do vídeo abaixo (X, YouTube, TikTok, Instagram, etc.)
                </p>
            </div>
            
            <!-- Formulário -->
            <form action="/baixar" method="POST" class="space-y-5" onsubmit="mostrarCarregamento()">
                
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-blue-400 text-gray-500">
                        <i class="fa-solid fa-link"></i>
                    </div>
                    <!-- Campo maior e mais fácil de tocar no celular -->
                    <input type="url" name="url" placeholder="https://..." required
                        class="w-full pl-12 pr-4 h-14 rounded-2xl bg-black/40 border border-white/10 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50 transition-all text-gray-100 placeholder-gray-500">
                </div>
                
                <!-- Botão com animação de tap (active:scale-95) -->
                <button type="submit" id="btn-download"
                    class="relative w-full overflow-hidden bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold h-14 rounded-2xl transition-all shadow-[0_0_20px_rgba(59,130,246,0.3)] hover:shadow-[0_0_30px_rgba(59,130,246,0.5)] active:scale-95 flex items-center justify-center group">
                    <span id="btn-text" class="flex items-center text-lg">
                        <i class="fa-solid fa-bolt mr-2 group-hover:scale-110 transition-transform"></i> Extrair Vídeo
                    </span>
                    <i id="btn-spinner" class="fa-solid fa-spinner fa-spin hidden text-2xl"></i>
                </button>
                
            </form>

            <!-- Rodapé do cartão -->
            <div class="mt-8 pt-6 border-t border-white/10 text-xs text-gray-500 flex flex-col gap-2">
                <p><i class="fa-solid fa-shield-halved mr-1"></i> Download rápido, seguro e gratuito.</p>
            </div>
        </div>
    </main>

    <!-- Script para dar resposta visual (loading) na hora de baixar -->
    <script>
        function mostrarCarregamento() {
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            const btnDownload = document.getElementById('btn-download');

            // Troca o texto por um ícone rodando
            btnText.classList.add('hidden');
            btnSpinner.classList.remove('hidden');
            
            // Dá um efeito visual de que está carregando
            btnDownload.style.opacity = '0.8';
            btnDownload.style.cursor = 'wait';
            
            // Restaura o botão após 12 segundos (tempo máximo pro download iniciar)
            setTimeout(() => {
                btnText.classList.remove('hidden');
                btnSpinner.classList.add('hidden');
                btnDownload.style.opacity = '1';
                btnDownload.style.cursor = 'pointer';
            }, 12000);
        }
    </script>
</body>
</html>
